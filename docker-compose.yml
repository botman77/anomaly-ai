services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: my-project-backend

    expose:
      - "8000"

    volumes:
      - ./backend:/app

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: my-project-frontend

    expose:
      - "3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    environment:
      NEXT_PUBLIC_BACKEND_URL: /api

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


  nginx:
    image: nginx:alpine

    container_name: my-project-nginx

    ports:
      - "${APP_PORT:-3000}:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_started

    restart: unless-stopped